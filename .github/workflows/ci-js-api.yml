name: CI for Wasm JS API tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-js-api.yml
      - test/harness/testharness.js
      - test/js-api/**

  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci-js-api.yml
      - test/harness/testharness.js
      - test/js-api/**

  schedule:
    - cron: '23 6 * * 1'

  workflow_dispatch:
    inputs:
      refresh:
        description: Test current releases and update the browser bump PR from the default branch
        type: boolean
        default: false
      chrome-version:
        description: Candidate Chrome version (blank uses the pin)
        type: string
      firefox-version:
        description: Candidate Firefox version (blank uses the pin)
        type: string
      safari-version:
        description: Candidate Safari version, or "installed" to accept the hosted version
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  refresh-schedule:
    name: Check browser refresh schedule
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      due: ${{ steps.schedule.outputs.due }}
    steps:
      - name: Check four-week cadence
        id: schedule
        run: |
          # Cron wakes the workflow weekly. Count UTC weeks from a fixed Monday.
          anchor=$(date -u -d '2026-11-23' +%s)
          now=$(date -u +%s)
          if (( now >= anchor && (now - anchor) / 604800 % 4 == 0 )); then
            echo 'due=true' >> "$GITHUB_OUTPUT"
          fi

  js-api:
    name: JS API (${{ matrix.browser }})
    needs: refresh-schedule
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.refresh-schedule.outputs.due == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            os: ubuntu-24.04
            version: ${{ inputs.firefox-version }}
          - browser: chrome
            os: ubuntu-24.04
            version: ${{ inputs.chrome-version }}
          - browser: safari
            os: macos-15
            version: ${{ inputs.safari-version }}
    env:
      BROWSER: ${{ matrix.browser }}
      REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Selenium
        run: python -m pip install selenium==4.53.0
      - name: Select browser version
        id: browser
        env:
          OVERRIDE: ${{ matrix.version }}
        run: |
          pin=$(jq -er --arg browser "$BROWSER" '.[$browser]' test/js-api/scripts/browser-versions.json)
          if [[ "$REFRESH" == true ]]; then
            case "$BROWSER" in
              chrome)
                latest=$(curl -fsSL --retry 3 --max-time 30 https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE)
                ;;
              firefox)
                latest=$(curl -fsSL --retry 3 --max-time 30 https://product-details.mozilla.org/1.0/firefox_versions.json | jq -er '.LATEST_FIREFOX_VERSION')
                ;;
              safari)
                latest=installed
                ;;
            esac
            if [[ "$latest" == installed && "$BROWSER" == safari ]]; then
              version=installed
            elif [[ "$latest" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
              # A release feed can lag behind the version already tested.
              version=$(printf '%s\n%s\n' "$pin" "$latest" | sort -V | tail -n 1)
            else
              echo "Could not resolve a stable $BROWSER version" >&2
              exit 1
            fi
          elif [[ -n "$OVERRIDE" ]]; then
            version=$OVERRIDE
          elif [[ "$BROWSER" == safari ]]; then
            # The hosted runner supplies Safari. Normal CI checks only its major version.
            version=${pin%%.*}
          else
            version=$pin
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ && ( "$BROWSER" != safari || "$version" != installed ) ]]; then
            echo "Invalid $BROWSER version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Enable Safari Remote Automation
        if: matrix.browser == 'safari'
        run: sudo /usr/bin/safaridriver --enable
      - name: Run JS API tests
        env:
          BROWSER_VERSION: ${{ steps.browser.outputs.version }}
          SE_SKIP_DRIVER_IN_PATH: 'true'
        run: |
          args=(--browser "$BROWSER" --json wasm-js-api.json)
          if [[ "$BROWSER" != safari || "$BROWSER_VERSION" != installed ]]; then
            args+=(--browser-version "$BROWSER_VERSION")
          fi
          status=0
          python test/js-api/scripts/run.py "${args[@]}" || status=$?
          # Candidate test failures are expected. The PR job validates the report.
          if [[ "$REFRESH" == true && "$status" == 1 && -s wasm-js-api.json ]]; then
            exit 0
          fi
          exit "$status"
      - name: Upload browser report
        if: ${{ !cancelled() && hashFiles('wasm-js-api.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: wasm-js-api-${{ matrix.browser }}
          path: wasm-js-api.json
          if-no-files-found: error
      - name: Summarize browser results
        if: ${{ !cancelled() && hashFiles('wasm-js-api.json') != '' }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from collections import Counter
          import json
          from pathlib import Path

          report = json.loads(Path('wasm-js-api.json').read_text(encoding='utf-8'))
          counts = Counter(case['outcome'] for case in report['results'])
          print(f"### Wasm JS API in {report['browser']} {report['version']}\n")
          print('| Pass | Fail | Expected failure | Unexpected pass | Skip |')
          print('| ---: | ---: | ---: | ---: | ---: |')
          print('| ' + ' | '.join(str(counts[outcome]) for outcome in ('PASS', 'FAIL', 'XFAIL', 'XPASS', 'SKIP')) + ' |')
          PY

  propose-browser-update:
    name: Propose browser update
    if: ${{ (github.event_name == 'schedule' || inputs.refresh) && github.ref_name == github.event.repository.default_branch }}
    needs: js-api
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency: js-api-browser-update
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download browser reports
        uses: actions/download-artifact@v4
        with:
          pattern: wasm-js-api-*
          path: ${{ runner.temp }}/js-api-reports
      - name: Update pins and expectations
        env:
          REPORTS: ${{ runner.temp }}/js-api-reports
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$(git ls-remote origin "refs/heads/$BASE_BRANCH" | cut -f1)" != "$GITHUB_SHA" ]]; then
            echo "The default branch moved during testing. Run the refresh again." >&2
            exit 1
          fi
          proposal=$(mktemp -d)
          pins=test/js-api/scripts/browser-versions.json
          manifest=test/js-api/scripts/expectations.json
          cp "$pins" "$proposal/pins.json"
          cp "$manifest" "$proposal/manifest.json"
          for browser in chrome firefox safari; do
            report="$REPORTS/wasm-js-api-$browser/wasm-js-api.json"
            pin=$(jq -er --arg browser "$browser" '.[$browser]' "$pins")
            version=$(jq -er --arg browser "$browser" \
              'select(.browser == $browser) | .version | select(test("^[0-9]+([.][0-9]+)+$"))' "$report")
            python3 test/js-api/scripts/update-expectations.py --require-complete \
              --manifest "$proposal/manifest.json" "$report" > "$proposal/manifest.next.json"
            if [[ "$version" == "$pin" ]]; then
              continue
            fi
            if [[ "$(printf '%s\n%s\n' "$pin" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
              echo "$browser $version is older than the tested pin $pin" >&2
              exit 1
            fi
            jq --arg browser "$browser" --arg version "$version" '.[$browser] = $version' \
              "$proposal/pins.json" > "$proposal/pins.next.json"
            mv "$proposal/pins.next.json" "$proposal/pins.json"
            mv "$proposal/manifest.next.json" "$proposal/manifest.json"
            printf -- '- %s %s → %s\n' "$browser" "$pin" "$version" >> "$GITHUB_STEP_SUMMARY"
          done
          cp "$proposal/pins.json" "$pins"
          cp "$proposal/manifest.json" "$manifest"
      - name: Open or update browser bump PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch=automation/js-api-browser-versions
          ref="refs/heads/$branch"
          previous=$(git ls-remote origin "$ref" | cut -f1)
          lease="--force-with-lease=$ref:$previous"
          git add -- test/js-api/scripts/browser-versions.json test/js-api/scripts/expectations.json
          if git diff --cached --quiet; then
            if [[ -n "$previous" ]]; then
              gh auth setup-git
              git push "$lease" origin ":$ref"
            fi
            echo "No browser updates to propose."
            exit 0
          fi

          pr=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f base="$BASE_BRANCH" \
            -f head="${GITHUB_REPOSITORY%%/*}:$branch" --jq '.[0].number // empty')
          if [[ -n "$pr" && -n "$previous" ]]; then
            previous_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$previous" --jq .tree.sha)
            if [[ "$(git write-tree)" == "$previous_tree" ]]; then
              echo "PR #$pr already contains this update."
              exit 0
            fi
          fi

          title='[js-api] Bump CI browser versions'
          body_file=$(mktemp)
          cat > "$body_file" <<EOF
          Update the browser pins and failure expectations from complete JS API suite runs.

          [Browser reports]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$title"
          gh auth setup-git
          # Rebuild the bot branch from the tested default-branch commit.
          git push "$lease" origin "HEAD:$ref"
          if [[ -n "$pr" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" \
              -F body=@"$body_file" --jq .html_url
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" \
              --head "$branch" --title "$title" --body-file "$body_file"
          fi
